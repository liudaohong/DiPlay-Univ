name: DiPlay-Univ Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.12433566

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core, Changan, audio/video and security unit tests
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:testDebugUnitTest \
              --tests "com.shilapi.xcertplay.security.KeystoreSecretBoxTest" \
              --tests "com.shilapi.xcertplay.adb.AdbKeysMigrationTest" \
              --tests "com.shilapi.xcertplay.adb.LocalAdbLoopbackTest" \
              --tests "com.shilapi.xcertplay.airplay.AirPlayPairLockTest" \
              --tests "com.shilapi.xcertplay.airplay.ControlFrameBufferSecurityTest" \
              --tests "com.shilapi.xcertplay.airplay.AirPlayTouchSlotsTest" \
              --tests "com.shilapi.xcertplay.airplay.DisplayOnlyAirPlayInfoTest" \
              --tests "com.shilapi.xcertplay.media.LostMusicFillTest" \
              --tests "com.shilapi.xcertplay.media.MediaTrackStallTest" \
              --tests "com.shilapi.xcertplay.media.MediaTrackRebuildTest" \
              --tests "com.shilapi.xcertplay.media.AndroidMediaSinkVideoOutputTest" \
              --tests "com.shilapi.xcertplay.media.MtkDecoderTuningTest" \
              --tests "com.shilapi.xcertplay.media.VideoBacklogRecoveryTest" \
              --tests "com.shilapi.xcertplay.media.VideoDecodeQueueTest" \
              --tests "com.shilapi.xcertplay.network.WifiScanPauseSessionTest" \
              --tests "com.shilapi.xcertplay.orchestration.WirelessConnectionProofTest" \
              --tests "com.shilapi.xcertplay.airplay.CarPlayMediaEngineSessionProofTest" \
            :common:testDebugUnitTest \
              --tests "com.shilapi.xcertplay.AsyncDiagnosticLogTest" \
              --tests "com.shilapi.xcertplay.BootReceiverSecurityTest" \
              --tests "com.shilapi.xcertplay.CarPlayDisplayOnlySessionTest" \
              --tests "com.shilapi.xcertplay.CrashRecordTest" \
              --tests "com.shilapi.xcertplay.CustomThemeBoundsTest" \
              --tests "com.shilapi.xcertplay.PortholeThemeTest" \
              --tests "com.shilapi.xcertplay.TwoFingerThemeSwipeTest" \
              --tests "com.shilapi.xcertplay.HevcSupportTest" \
              --tests "com.shilapi.xcertplay.backup.SettingsBackupCodecTest" \
              --tests "com.shilapi.xcertplay.backup.SettingsBackupServerTest" \
            --no-daemon --stacktrace

      - name: Build source-only Debug and Release (R8) APKs
        run: ./gradlew :mobile:assembleDebug :mobile:assembleRelease --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 7
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
